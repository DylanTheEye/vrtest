<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab 1.1</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="app.js"></script>
</head>
<body>
    <a-scene>
        <a-sky src="1nowy9jznwne1.jpg" rotation="0 -130 0"></a-sky>
        <a-text value="Hoi ik ben Dylan" position="-1 1.5 -3" color="#F358fe" interactief-object></a-text>

       <a-entity>
            <a-entity cursor="rayOrigin: mouse;" position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.02;
            radiusOuter: 0.03"
            material="color: white; shader: flat">
        </a-entity>

    </a-entity>

    <a-box id="mijnKubus" position="-2 1 -4" color="blue" interactief-object></a-box>
    <a-sphere id="mijnBol" position="2 1 -4" color="red"></a-sphere>

    </a-scene>
</body>
</html>
